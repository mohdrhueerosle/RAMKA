<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAMKA Family</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#faf8f5;
  --bg2:#f3f0eb;
  --bg3:#ece8e0;
  --surface:#ffffff;
  --border:#e8e3d9;
  --border2:#d9d2c5;
  --ink:#1a1714;
  --ink2:#6b6359;
  --ink3:#a09589;
  --amber:#b8860b;
  --amber2:#d4a017;
  --amber-light:#fdf3d7;
  --amber-mid:#f5e5a0;
  --green:#3d6b3a;
  --green-light:#edf5ec;
  --red:#b53a2a;
  --red-light:#fdf0ee;
  --blue:#2a5a8c;
  --blue-light:#eef4fb;
  --radius:4px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;line-height:1.5;}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(250,248,245,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:0 2rem;
  display:flex;align-items:center;gap:0;
  box-shadow:0 1px 12px rgba(26,23,20,.05);
}
.topbar-logo{
  font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;
  color:var(--ink);letter-spacing:.08em;
  padding:.9rem 1.5rem .9rem 0;
  border-right:1px solid var(--border);
  margin-right:1.5rem;
  white-space:nowrap;
}
.topbar-logo span{color:var(--amber);}
.tabs{display:flex;gap:0;flex:1;}
.tab{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink2);
  padding:1rem 1.2rem;cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s;
  white-space:nowrap;user-select:none;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);}
.topbar-time{
  margin-left:auto;
  font-family:'DM Mono',monospace;font-size:.6rem;
  color:var(--ink3);letter-spacing:.1em;white-space:nowrap;
}

/* ── PAGES ── */
.page{display:none;padding:2rem;max-width:1100px;margin:0 auto;}
.page.active{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── DASH HEADER ── */
.dash-header{
  margin-bottom:2rem;padding-bottom:1.5rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;
}
.dash-greeting{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.8rem,4vw,2.6rem);
  font-weight:500;line-height:1.1;color:var(--ink);
}
.dash-greeting em{font-style:italic;color:var(--amber);}
.dash-date{
  font-family:'DM Mono',monospace;font-size:.62rem;
  color:var(--ink3);letter-spacing:.12em;margin-top:.3rem;
}
.dash-location{
  font-family:'DM Mono',monospace;font-size:.6rem;
  color:var(--ink3);letter-spacing:.14em;text-align:right;
}

/* ── GRID ── */
.dash-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:1rem;
}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:580px){.dash-grid{grid-template-columns:1fr;}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.4rem;
  position:relative;overflow:hidden;
}
.card.span2{grid-column:span 2;}
.card.span3{grid-column:span 3;}
@media(max-width:900px){.card.span3{grid-column:span 2;}.card.span2{grid-column:span 2;}}
@media(max-width:580px){.card.span2,.card.span3{grid-column:span 1;}}

.card-label{
  font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:1rem;
  display:flex;align-items:center;gap:.6rem;
}
.card-label::after{content:'';flex:1;height:1px;background:var(--border);max-width:40px;}

/* ── WEATHER ── */
.weather-main{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem;}
.weather-icon{font-size:2.2rem;line-height:1;}
.weather-temp{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:500;line-height:1;color:var(--ink);}
.weather-desc{font-size:.8rem;color:var(--ink2);margin-top:.2rem;}
.weather-row{display:flex;gap:1.2rem;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--border);}
.w-stat{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.08em;color:var(--ink3);}
.w-stat strong{color:var(--ink2);display:block;font-size:.72rem;margin-bottom:.1rem;}

/* ── COUNTDOWN ── */
.cd-dest{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-style:italic;color:var(--ink2);margin-bottom:.8rem;}
.cd-nums{display:flex;align-items:flex-end;gap:.5rem;}
.cd-block{text-align:center;}
.cd-num{
  font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:700;
  line-height:1;color:var(--amber);
}
.cd-unit{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:.15em;color:var(--ink3);margin-top:.1rem;}
.cd-sep{font-size:1.5rem;color:var(--border2);padding-bottom:.25rem;}
.cd-note{margin-top:.7rem;font-size:.75rem;color:var(--ink3);padding-top:.7rem;border-top:1px solid var(--border);}

/* ── QUICK STATS ── */
.qstat-row{display:flex;justify-content:space-between;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--border);}
.qstat-row:last-child{border-bottom:none;}
.qstat-label{font-size:.82rem;color:var(--ink2);}
.qstat-val{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:var(--amber);}

/* ── EVENTS ── */
.events-list{display:flex;flex-direction:column;gap:.5rem;max-height:280px;overflow-y:auto;padding-right:.3rem;}
.event-item{
  display:flex;align-items:center;gap:.8rem;
  padding:.65rem .8rem;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--bg);
  transition:border-color .2s,background .2s;cursor:default;
}
.event-item:hover{background:var(--bg2);}
.event-item.urgent{border-left:3px solid var(--red);background:var(--red-light);}
.event-item.soon{border-left:3px solid var(--amber);background:var(--amber-light);}
.event-item.normal{border-left:3px solid var(--green);background:var(--green-light);}
.event-item.trip{border-left:3px solid var(--blue);background:var(--blue-light);}
.event-info{flex:1;min-width:0;}
.event-title{font-size:.84rem;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-who{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--ink3);margin-top:.1rem;}
.event-meta{text-align:right;flex-shrink:0;}
.event-date{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--ink2);}
.event-days{font-size:.6rem;color:var(--ink3);}

/* ── TASKS ── */
.tasks-list{display:flex;flex-direction:column;gap:.4rem;max-height:280px;overflow-y:auto;padding-right:.3rem;}
.task-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.55rem .7rem;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--bg);
  cursor:pointer;transition:background .15s;
}
.task-item:hover{background:var(--bg2);}
.task-item.done{opacity:.5;}
.task-item.done .task-text{text-decoration:line-through;}
.task-check{
  width:16px;height:16px;border:1.5px solid var(--border2);
  border-radius:3px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;transition:all .15s;color:#fff;
}
.task-item.done .task-check{background:var(--green);border-color:var(--green);}
.task-text{font-size:.82rem;flex:1;}
.task-tag{
  font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:.1em;
  color:var(--ink3);background:var(--bg2);
  padding:.15rem .4rem;border-radius:2px;white-space:nowrap;
}

/* ── BIRTHDAYS ── */
.bday-list{display:flex;flex-direction:column;gap:0;}
.bday-item{
  display:flex;align-items:center;gap:.8rem;
  padding:.6rem 0;border-bottom:1px solid var(--border);
}
.bday-item:last-child{border-bottom:none;}
.bday-initial{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--amber),var(--amber2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:.9rem;font-weight:700;
  color:#fff;flex-shrink:0;
  overflow:hidden;
}
.bday-initial img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.bday-item.anniversary .bday-initial{background:linear-gradient(135deg,#c0392b,#e74c3c);font-size:.75rem;}
.bday-name{font-size:.84rem;flex:1;}
.bday-date-label{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--ink3);}
.bday-countdown{font-size:.7rem;color:var(--amber);font-weight:500;}

/* ── SCHOOL EVENTS ── */
/* reuses event-item styles */

/* ── ADD ROW ── */
.add-row{display:flex;gap:.5rem;margin-top:.8rem;}
.add-input{
  flex:1;background:var(--bg);border:1px solid var(--border);
  color:var(--ink);font-family:'DM Sans',sans-serif;font-size:.82rem;
  padding:.5rem .7rem;border-radius:var(--radius);outline:none;
  transition:border-color .2s;
}
.add-input:focus{border-color:var(--amber);}
.add-input::placeholder{color:var(--ink3);}
.add-btn{
  background:var(--amber);color:#fff;
  border:none;padding:.5rem 1rem;border-radius:var(--radius);
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;transition:background .2s;white-space:nowrap;
}
.add-btn:hover{background:var(--amber2);}

/* ── TRIPS PAGE ── */
.page-header{margin-bottom:2rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border);}
.page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:500;color:var(--ink);}
.page-title em{font-style:italic;color:var(--amber);}
.page-sub{font-size:.85rem;color:var(--ink2);margin-top:.3rem;}

.trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-bottom:2rem;}

.trip-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.6rem;cursor:default;transition:box-shadow .2s,border-color .2s;
  position:relative;overflow:hidden;
}
.trip-card:hover{box-shadow:0 4px 20px rgba(26,23,20,.08);border-color:var(--border2);}
.trip-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  opacity:0;transition:opacity .2s;
}
.trip-card:hover::after{opacity:1;}
.trip-card.georgia::after{background:linear-gradient(90deg,var(--green),transparent);}
.trip-card.malaysia::after{background:linear-gradient(90deg,var(--red),transparent);}
.trip-card.future::after{background:linear-gradient(90deg,var(--ink3),transparent);}

.trip-flag{font-size:1.8rem;display:block;margin-bottom:.8rem;}
.trip-year{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.18em;color:var(--ink3);margin-bottom:.3rem;}
.trip-name{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:500;margin-bottom:.3rem;color:var(--ink);}
.trip-places{font-size:.78rem;color:var(--ink2);margin-bottom:1rem;line-height:1.6;}
.trip-divider{height:1px;background:var(--border);margin-bottom:.8rem;}
.trip-stats{display:flex;gap:1.5rem;margin-bottom:.8rem;}
.trip-stat strong{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--ink);display:block;}
.trip-stat span{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;}
.trip-tags{display:flex;flex-wrap:wrap;gap:.3rem;}
.trip-tag{
  font-family:'DM Mono',monospace;font-size:.53rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.2rem .5rem;border-radius:2px;
  background:var(--bg2);color:var(--ink2);border:1px solid var(--border);
}
.trip-card.georgia .trip-tag.hi{background:var(--green-light);color:var(--green);border-color:rgba(61,107,58,.2);}
.trip-card.malaysia .trip-tag.hi{background:var(--red-light);color:var(--red);border-color:rgba(181,58,42,.2);}
.trip-card.future{opacity:.45;}
.trip-card.future:hover{opacity:.65;}

/* DNA */
.section-label{
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:1rem;margin-top:1.5rem;
  display:flex;align-items:center;gap:.8rem;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.dna-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
@media(max-width:580px){.dna-grid{grid-template-columns:1fr;}}
.dna-item{
  padding:1rem;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);border-left:3px solid var(--amber);
}
.dna-num{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:var(--amber);opacity:.35;line-height:1;margin-bottom:.3rem;}
.dna-text{font-size:.8rem;color:var(--ink2);line-height:1.6;}

/* ── FAMILY PAGE ── */
.family-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;
  margin-bottom:2rem;
}
@media(max-width:580px){.family-stats{grid-template-columns:repeat(2,1fr);}}
.fstat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.2rem;text-align:center;
}
.fstat-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:var(--amber);}
.fstat-label{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-top:.2rem;}

.family-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-bottom:2rem;}
.member-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.5rem;transition:box-shadow .2s,border-color .2s;
}
.member-card:hover{box-shadow:0 4px 16px rgba(26,23,20,.07);border-color:var(--border2);}
.member-letter{
  font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:700;
  color:var(--amber);opacity:.18;line-height:1;margin-bottom:.4rem;
}
.member-name{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:500;margin-bottom:.15rem;}
.member-role{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-bottom:.8rem;}
.member-detail{font-size:.78rem;color:var(--ink2);padding:.25rem 0;border-bottom:1px solid var(--border);}
.member-detail:last-child{border-bottom:none;}
.member-detail span{color:var(--ink3);font-size:.72rem;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(26,23,20,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:2rem;width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(26,23,20,.15);
}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:500;margin-bottom:1.2rem;}
.modal-fields{display:flex;flex-direction:column;gap:.8rem;}
.field-label{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-bottom:.3rem;}
.modal select{
  width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--ink);font-family:'DM Sans',sans-serif;font-size:.82rem;
  padding:.55rem .7rem;border-radius:var(--radius);outline:none;
}
.modal-actions{display:flex;gap:.5rem;margin-top:1.2rem;}
.btn-cancel{flex:1;background:transparent;border:1px solid var(--border);color:var(--ink2);font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:.6rem;border-radius:var(--radius);cursor:pointer;}
.btn-cancel:hover{background:var(--bg2);}
.btn-save{flex:2;background:var(--amber);border:none;color:#fff;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:.6rem;border-radius:var(--radius);cursor:pointer;}
.btn-save:hover{background:var(--amber2);}

/* ── EMPTY STATE ── */
.empty{color:var(--ink3);font-size:.8rem;font-style:italic;padding:.4rem 0;}

/* ── NAV MOBILE ── */
@media(max-width:500px){
  .topbar{padding:0 1rem;}
  .topbar-logo{padding:.8rem .8rem .8rem 0;margin-right:.8rem;}
  .tab{padding:.9rem .7rem;font-size:.58rem;}
  .topbar-time{display:none;}
  .page{padding:1.2rem;}
}
